<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card design</title>
    <style>
        body {
            background-color: gray;
        }

        * {
            margin: 0%;
            padding: 0px;
        }

        div img {

            width: 80vw;
            border-radius: 7px;
        }

        .bor {
            position: relative;
            border: 2px solid black;
            margin-right: 25px;
            padding: 2px;
            border-radius: 10px;
            top: 5px;
        }

        p {
            position: relative;
            left: 5px;
            

        }

        #read {
            position: relative;
            left: 40px;
            top: 10px;
            /* background-color: aqua; */
            text-align: center;
            padding: 3px;
            border-radius: 9px;
            border-radius: 7px;
            color: aqua;
           

        }

        #whole {
            position: relative;
            left: 10vw;
            top: 2vh;
            /* right: 10vw;
            bottom: 10vh; */
            /* border: 2px solid black; */
           
            background-color: aliceblue;
            padding: 5px;
            height: 344px;
            width: 200px;
            border-radius: 7px;
        }

        h2 {
            margin: 10px;
            padding: 5px;


        }
    </style>
</head>

<body>
    <div id="whole">
        <div>
            <img src="orient copy.png" alt="img">

        </div>
        <span class="bor">nature</span>
        <span class="bor">lake</span>
        <br>
        <h2>my card</h2>

            deleniti consequatur est, ex id? Eaque excepturi natus at aspernatur omnis in dicta eum quos.</p>
        <span id="read"><button>read more</button></span>
            
    </div>

</body>

</html>
